resolver 127.0.0.11 valid=10s;

server {
    listen 80;

    # Служебные файлы SEO отдаёт бэкенд, чтобы адреса брались из PUBLIC_URL
    location = /robots.txt  { set $be http://backend:8000; proxy_pass $be; include /etc/nginx/proxy.inc; }
    location = /sitemap.xml { set $be http://backend:8000; proxy_pass $be; include /etc/nginx/proxy.inc; }
    location /api/          { set $be http://backend:8000; proxy_pass $be; include /etc/nginx/proxy.inc; }

    location / {
        set $fe http://frontend:4000;
        proxy_pass $fe;
        include /etc/nginx/proxy.inc;
    }
}
